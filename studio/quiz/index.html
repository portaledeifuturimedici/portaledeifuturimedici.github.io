    for (var i = 0; i < vecchi.length; i++) {
      var s = vecchi[i], n = document.createElement('script');
      for (var j = 0; j < s.attributes.length; j++) {
        n.setAttribute(s.attributes[j].name, s.attributes[j].value);
      }
      /* Uno script con src INSERITO da codice e' `async` per difetto: eseguono
         in ordine di ARRIVO, non di documento — e `defer` scritto nel tag non
         conta piu'. Finche' i motori di studio erano indipendenti nessuno se
         ne accorgeva; da quando hanno bisogno che studio_fetch.js sia gia'
         partito, l'ordine e' sostanza. `async=false` e' il modo standard per
         riavere l'ordine del documento.
         NB: qui dentro NON si scrivono le parole-spia di verifica() (sono le
         parole che esistono solo nel chiaro): finirebbero nella pagina-cancello
         e la farebbero passare per non cifrata. */
      n.async = false;
      n.text = s.text;
      s.parentNode.replaceChild(n, s);
    }
  }
  function decifra(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (k) {
        return crypto.subtle.decrypt({name: 'AES-GCM', iv: b2a(IV)}, k, b2a(DATA));
      })
      .then(function (buf) { apri(new TextDecoder().decode(buf)); });
  }
  /* Dalla password alla pagina aperta. UNA funzione per le due strade (il
     modulo e l'account), cosi' non possono divergere: se un giorno cambia la
     derivazione, cambia per tutte e due. */
  function apriCon(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2',
                                   false, ['deriveBits'])
      .then(function (k) {
        return crypto.subtle.deriveBits(
          {name: 'PBKDF2', hash: 'SHA-256', salt: b2a(SALT), iterations: ITER},
          k, 256);
      })
      .then(function (bits) {
        var raw = new Uint8Array(bits);
        /* La chiave si registra PRIMA di aprire la pagina, non dopo: da quando
           i DATI dei motori sono cifrati, gli script della pagina decifrata la
           cercano in sessione appena partono, e «dopo» era una gara che si
           vinceva solo per come sono ordinati microtask e task. Se poi la
           password si rivela sbagliata la si toglie subito (vedi il .catch):
           una chiave sbagliata in sessione farebbe fallire il caricamento dei
           materiali anche sulle pagine successive. */
        var b = '';
        for (var i = 0; i < raw.length; i++) b += String.fromCharCode(raw[i]);
        try { sessionStorage.setItem('studio-key',
              JSON.stringify({salt: SALT, k: btoa(b)})); } catch (e) {}
        return decifra(raw);
      })
      .catch(function (e) {
        try { sessionStorage.removeItem('studio-key'); } catch (e2) {}
        throw e;
      });
  }
  function mostra(id) { document.getElementById(id).className =
    document.getElementById(id).className.replace(' nascosto', '').replace('nascosto', ''); }
  function dici(t) { document.getElementById('stato').textContent = t; }
  function soloPassword(testo) {
    dici(testo); mostra('acc'); mostra('modulo');
  }

  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.className = 'err';
    apriCon(document.getElementById('pw').value).catch(function () {
      err.className = 'err show'; btn.disabled = false;
    });
  });

  /* Chi torna da una sessione gia' sbloccata non deve rifare niente. */
  try {
    var cache = JSON.parse(sessionStorage.getItem('studio-key') || 'null');
    if (cache && cache.salt === SALT) {
      decifra(b2a(cache.k)).catch(function () {});
      return;
    }
  } catch (e) {}

  /* L'ACCOUNT PRIMA DELLA PASSWORD (2026-09-18). Il fatto: «sono iscritto,
     clicco sulle dispense e mi reinvia al paywall». Nessuna pagina chiedeva
     chi sei. Adesso il cancello lo chiede, e ha QUATTRO esiti, non due:
       - abbonato       -> la pagina si apre da sola, senza password;
       - iscritto senza pacchetto -> al pagamento, come ha chiesto l'utente;
       - diritto PARZIALE (una materia) -> glielo si DICE, non lo si manda a
         pagare di nuovo: e' quello che fa sembrare rotto un sito a chi ha
         gia' pagato qualcosa;
       - non entrato    -> «Entra col tuo account», e la password resta come
         seconda strada per chi l'ha ricevuta prima di questo giorno.
     Se la rete non risponde, si ripiega sulla password: il cancello non deve
     mai lasciare fuori un abbonato perche' un servizio in piu' e' giu'. */
  var API = 'https://account.portaledeifuturimedici.com';
  var tok = '';
  try { tok = localStorage.getItem('appunti-tok') || ''; } catch (e) {}
  var entra = document.getElementById('entra');
  entra.href = entra.href + (entra.href.indexOf('?') < 0 ? '?' : '&') +
               'torna=' + encodeURIComponent(location.pathname + location.search);
  if (!API) { soloPassword('Pagina riservata. Inserisci la password per aprire il contenuto.'); return; }
  if (!tok) {
    soloPassword('Pagina riservata agli abbonati. Entra col tuo account e si apre da sola.');
    return;
  }
  fetch(API + '/studio/chiave', {headers: {'Authorization': 'Bearer ' + tok}})
    .then(function (r) {
      if (r.status === 401) return {sloggato: true};
      return r.json().then(function (d) { d._stato = r.status; return d; });
    })
    .then(function (d) {
      if (d.consentito && d.password) {
        dici('Abbonamento attivo: apro la pagina…');
        return apriCon(d.password).catch(function () {
          soloPassword('Non riesco ad aprire la pagina con il tuo account. Riprova, o usa la password.');
        });
      }
      if (d.sloggato) {
        soloPassword('Sessione scaduta: entra di nuovo e la pagina si apre da sola.');
        return;
      }
      /* Si manda al pagamento SOLO davanti a un «no» ESPLICITO (200 con
         consentito:false). Qualunque altra risposta — il 404 di un Worker
         vecchio che la rotta non la conosce, un 503, un 500 — e' un «non lo
         so», e un «non lo so» non deve mai far pagare chi ha gia' pagato:
         si ripiega sulla password. Senza questa riga, pubblicare il cancello
         prima di ricaricare il Worker avrebbe mandato al pagamento proprio gli
         abbonati di oggi, quelli con la password e con un account. */
      if (d._stato !== 200) {
        soloPassword('Non riesco a verificare il tuo abbonamento adesso. Se hai la password, usala qui sotto.');
        return;
      }
      if (d.parziale) {
        dici('Il tuo abbonamento non comprende tutto il pacchetto: questa pagina ne fa parte. Scrivici se pensi sia un errore.');
        mostra('acc');
        return;
      }
      dici('Il tuo account non ha ancora il pacchetto: ti porto alla pagina per abbonarti…');
      setTimeout(function () { location.href = '/#pacchetto'; }, 1400);
    })
    .catch(function () {
      soloPassword('Non riesco a verificare il tuo account adesso. Se hai la password, usala qui sotto.');
    });
})();
</script>
</body>
</html>
