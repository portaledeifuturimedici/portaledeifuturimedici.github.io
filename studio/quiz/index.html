  function b2a(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);

  }
  function apri(html) {
    /* NON document.write: misurato sul live 2026-07-21, il documento NON veniva
       sostituito — la pagina decifrata finiva APPESA dentro il cancello (la
       .card restava nel DOM, le <meta> del contenuto cadevano nel body, il
       titolo restava «— accesso») e soprattutto sopravviveva lo <style> del
       cancello con `body{display:flex;align-items:center}`: il <main> si
       stringeva a 357px su 1265 e la griglia .doc calcolava `250px 0px` ->
       contenuto illeggibile, su desktop E su mobile.
       Qui si sostituisce l'INTERO <html>, così testa e stili del cancello se
       ne vanno con lui. */
    var nuovo = new DOMParser().parseFromString(html, 'text/html');
    document.replaceChild(document.importNode(nuovo.documentElement, true),
                          document.documentElement);
    /* gli script adottati da un altro documento NON si eseguono: vanno
       ricreati, o il sito resta senza tema/indice/ricerca (site.js). */
    var vecchi = document.querySelectorAll('script');
    for (var i = 0; i < vecchi.length; i++) {
      var s = vecchi[i], n = document.createElement('script');
      for (var j = 0; j < s.attributes.length; j++) {
        n.setAttribute(s.attributes[j].name, s.attributes[j].value);
      }
      /* Uno script con src INSERITO da codice e' `async` per difetto: eseguono
         in ordine di ARRIVO, non di documento — e `defer` scritto nel tag non
         conta piu'. Da quando i motori hanno bisogno che studio_fetch.js sia
         gia' partito, l'ordine e' sostanza. `async=false` e' il modo standard
         per riavere l'ordine del documento.
         NB: qui dentro NON si scrivono le parole-spia di verifica() (sono le
         parole che esistono solo nel chiaro): finirebbero nella pagina-cancello
         e la farebbero passare per non cifrata. */
      n.async = false;
      n.text = s.text;
      s.parentNode.replaceChild(n, s);
    }

       dell'indirizzo quando carica il CANCELLO, dove quell'id non c'e'; dopo la
       sostituzione nessuno ci torna. Un link a un blocco di una lezione
       (/studio/appunti/<lezione>.html#trappole-errori-a) apriva la pagina in cima,
       col blocco chiuso. Qui: il salto e' immediato (lo scorrimento morbido del
       sito, su migliaia di pixel, non arriva mai prima che la pagina cambi forma)

       stile, immagini, misura), se non ti muovi; al cambio d'ancora vale lo
       scorrimento del sito, con la stessa finestra. Il codice e' ANCORA_JS. */
    tieni();

        fuori('Il tuo account non ha ancora lo Studypack completo. Se hai già pagato, ' +
              'nel tuo profilo vedi a che punto è.', false);
        mostra('profilo');
        mostra('aiuto');
      })
      .catch(function (e) {
        clearTimeout(timer);
        /* SENZA RETE (07/10, l'app salva lo Studypack com'è online): la pagina salvata è
           arrivata. Dal 07/10 (G2) la sua chiave puo' stare sul dispositivo: la si prova, e
           solo se non c'e' (o non vale) si dice cosa manca, invece di un «riprova» che
           senza campo non porta da nessuna parte. Un'attesa scaduta o un errore che non e'
           di rete restano un «non lo so». */
        var giu = senzaRete() || !!(e && e.name === 'TypeError');
        dalDispositivo(function (es) {
          if (giu) senzaReteDi(es); else riprova(NON_SO);
        });
      });
  }

  /* La chiave di QUESTA build gia' in sessione: si apre senza chiedere niente.
     Se non apre (build sostituita, voce guasta) la si butta e si va avanti — mai
     una pagina muta. */
  var cache = null, entrato = !!tok;
  try { cache = JSON.parse(sessionStorage.getItem(VOCE_CHIAVE) || 'null'); } catch (e) {}
  /* la chiave in sessione vale solo finche' c'e' un account entrato: chi esce
     da un'altra scheda non deve lasciare /studio aperta in questa (finding Z9).
     Lo stesso per la chiave sul dispositivo (G2): senza nessuno entrato se ne va. */
  if (cache && !entrato) dimentica();
  if (!entrato) ChiaveDispositivo.dimentica();
  /* Senza la chiave in sessione: se il sistema sa gia' che la rete non c'e', la chiave
     del dispositivo subito (G2); altrimenti si chiede all'account. */
  function avanti() {
    if (entrato && senzaRete()) { dalDispositivo(senzaReteDi); return; }
    chiediAllAccount();
  }
  if (cache && entrato && cache.salt === SALT && cache.k) {
    var k = null;
    try { k = b2a(cache.k); } catch (e) {}
    if (k) {
      decifra(k).catch(function () { dimentica(); avanti(); });
    } else {
      dimentica(); avanti();
    }
  } else {
    avanti();
  }
})();
</script>
