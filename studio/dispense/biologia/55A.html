      return fai(false, 'readwrite', function (st) {
        for (var i = 0; i < sali.length; i++) st['delete'](sali[i]);
      }).then(function () {}, function () {});
    }
    /* TUTTO il database: l'uscita dall'account, il diritto tolto, «Cancella le copie». */
    function dimentica() {
      return new Promise(function (ok) {
        var req = null;
        try {
          if (typeof indexedDB !== 'undefined') req = indexedDB.deleteDatabase(DB_CHIAVI);
        } catch (e) { req = null; }
        if (!req) { ok(); return; }
        var t = setTimeout(ok, ATTESA_MS);
        req.onsuccess = req.onerror = req.onblocked = function () { clearTimeout(t); ok(); };
      });
    }
    /* l'impronta della SESSIONE: il token resta dov'e', qui se ne tiene solo l'impronta */
    function impronta(tok) {
      return crypto.subtle.digest('SHA-256',
                                  new TextEncoder().encode('portale-studio-sessione:' + tok))
        .then(function (b) {
          var a = new Uint8Array(b), s = '';
          for (var i = 0; i < a.length; i++) s += (a[i] < 16 ? '0' : '') + a[i].toString(16);
          return s;
        });
    }
    /* le pubblicazioni salvate (una cache per sale): {sale: true}, null = non si sa */
    function copie() {
      try {
        if (typeof caches === 'undefined' || !caches || !caches.keys) return Promise.resolve(null);
        return caches.keys().then(function (nomi) {
          var s = {};
          for (var i = 0; i < nomi.length; i++) {
            var n = String(nomi[i]);
            if (n.indexOf(COPIA) === 0) s[n.slice(COPIA.length)] = true;
          }
          return s;
        }, function () { return null; });
      } catch (e) { return Promise.resolve(null); }
    }
    function vuoto(o) {
      for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) return false; }
      return true;
    }
    /* LA CHIAVE di `sale` per chi e' entrato con `tok`: {chiave, scade} oppure {motivo}:
       nessuno (nessun account entrato), niente (nessuna copia salvata), assente, scaduta,
       orologio, altra (c'e' solo la chiave di un'altra pubblicazione), guasto. Ogni voce che
       non vale piu' si cancella qui. `usa`: si sta aprendo una pagina (si segna l'uso). */
    function leggi(sale, tok, usa) {
      if (!tok) return dimentica().then(function () { return {motivo: 'nessuno'}; });
      if (!pronto()) return Promise.resolve({motivo: 'guasto'});
      return copie().then(function (cs) {
        if (cs && vuoto(cs)) return dimentica().then(function () { return {motivo: 'niente'}; });
        return Promise.all([impronta(tok), tutte()]).then(function (r) {
          var s = r[0], ora = Date.now(), via = [], mia = null, motivo = 'assente', altre = 0;
          for (var i = 0; i < r[1].length; i++) {
            var x = r[1][i], perche = '';
            if (cs && !cs[x.sale]) perche = 'copia';
            else if (x.sessione !== s) perche = 'sessione';
            else if (!(ora < x.scade)) perche = 'scaduta';
            else if (ora + TOLLERANZA_MS < (x.visto || x.rinnovata || 0)) perche = 'orologio';
            if (perche) {
              via.push(x.sale);
              if (x.sale === sale && (perche === 'scaduta' || perche === 'orologio')) motivo = perche;
            } else if (x.sale === sale) {
              mia = x;
            } else {
              altre++;
            }
          }
          return togli(via).then(function () {
            if (!mia) return {motivo: motivo === 'assente' && altre ? 'altra' : motivo};
            if (!usa || !ancora(tok)) return {chiave: mia.chiave, scade: mia.scade};
            mia.visto = Math.max(ora, mia.visto || 0);
            return metti(mia).then(null, function () {}).then(function () {
              return {chiave: mia.chiave, scade: mia.scade};
            });
          });
        });
      }).then(null, function () { return {motivo: 'guasto'}; });
    }
    /* DOPO IL SI' DEL WORKER per `sale`, con la chiave `grezza` (i suoi byte, in memoria) che
       ha appena aperto quella pubblicazione. La voce di `sale` si scrive o si rinnova SOLO se
       la sua copia e' salvata; se ne vanno le voci che il si' smentisce: senza copia, di
       un'altra sessione (la stessa regola di `leggi`), di un altro account, o di una madre che
       il Worker non riconosce piu'. `info` = {uid, madre: l'impronta della madre di QUESTA
       chiave, madri: le impronte che il Worker riconosce}. -> true se la voce c'e'. Non
       rifiuta mai. */
    function dopoSi(sale, grezza, tok, info) {
      if (!tok || !pronto()) return Promise.resolve(false);
      info = info || {};
      return copie().then(function (cs) {
        if (!cs) return false;
        if (vuoto(cs)) return dimentica().then(function () { return false; });
        return Promise.all([impronta(tok), tutte()]).then(function (r) {
          var s = r[0], via = [], madri = info.madri || [];
          for (var i = 0; i < r[1].length; i++) {
            var x = r[1][i];
            if (x.sale === sale) continue;
            if (!cs[x.sale] || x.sessione !== s ||
                (info.uid && x.uid && String(x.uid) !== String(info.uid)) ||
                (madri.length && madri.indexOf(x.madre || '') < 0)) via.push(x.sale);
          }
          return togli(via).then(function () {
            if (!cs[sale]) return togli([sale]).then(function () { return false; });
            return crypto.subtle.importKey('raw', grezza, 'AES-GCM', false, ['decrypt'])
              .then(function (k) {
                var ora = Date.now();
                if (!ancora(tok)) return Promise.reject(new Error('uscito'));
                return metti({sale: sale, chiave: k, sessione: s, uid: info.uid || null,
                              madre: info.madre || '', rinnovata: ora,
                              scade: ora + GIORNI * GIORNO_MS, visto: ora});
              }).then(function () { return true; });
          });
        });
      }).then(null, function () { return false; });
    }
    /* le voci delle copie che non ci sono piu' (un «Aggiorna» completo toglie la vecchia) */
    function pota() {
      if (!pronto()) return Promise.resolve();
      return copie().then(function (cs) {
        if (!cs) return;
        if (vuoto(cs)) return dimentica();
        return tutte().then(function (t) {
          var via = [];
          for (var i = 0; i < t.length; i++) { if (!cs[t[i].sale]) via.push(t[i].sale); }
          return togli(via);
        });
      }).then(null, function () {});
    }
    return {GIORNI: GIORNI, GLOBALE: GLOBALE, pronto: pronto, leggi: leggi, dopoSi: dopoSi,
            togli: togli, dimentica: dimentica, pota: pota};
  })();
  /* `k` e' una CryptoKey: -> la pagina in chiaro (testo), oppure un rifiuto se la chiave non
     la apre (AES-GCM: chiave sbagliata = decifratura RIFIUTATA). */
  function decifraCon(k) {
    return crypto.subtle.decrypt({name: 'AES-GCM', iv: b2a(IV)}, k, b2a(DATA))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function decifra(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(decifraCon).then(apri);
  }
  function el(id) { return document.getElementById(id); }
  function mostra(id) { el(id).classList.remove('nascosto'); }
  function nascondi(id) { el(id).classList.add('nascosto'); }
  function dici(t) { el('stato').textContent = t; }
  function dimentica() { try { sessionStorage.removeItem(VOCE_CHIAVE); } catch (e) {} }
  /* La chiave si registra PRIMA di aprire la pagina: gli script della pagina
     decifrata la cercano in sessione appena partono (studio_fetch.js), e
     «dopo» sarebbe una gara. Se poi non apre, la si toglie subito. */
  function apriCon(k64) {
    try { sessionStorage.setItem(VOCE_CHIAVE, JSON.stringify({salt: SALT, k: k64})); } catch (e) {}
    return decifra(b2a(k64)).catch(function (e) { dimentica(); throw e; });
  }
  /* fuori: nessuna chiave. conEntra=false quando si e' gia' entrati;
     conProfilo quando la strada e' il profilo (conferma dell'email), e allora
     «abbonati» sparisce: a chi ha gia' pagato non si mostra un pagamento. */
  function fuori(testo, conEntra, conProfilo) {
    dici(testo);
    if (conEntra === false) nascondi('entra'); else mostra('entra');
    if (conProfilo) { mostra('profilo'); nascondi('abbonati'); }
    mostra('acc');
  }
  function riprova(testo) { dici(testo); mostra('riprova'); }

  /* «torna» porta anche il frammento (08/10): da un link profondo, come quelli della
     raccolta delle mappe verso il blocco dentro la lezione, dopo l'accesso si torna al
     blocco e non in cima. La pagina dell'account lo accetta gia' (stessa origine). */
  var entra = el('entra');
  entra.href = entra.href + (entra.href.indexOf('?') < 0 ? '?' : '&') +
               'torna=' + encodeURIComponent(location.pathname + location.search +
                                             (location.hash || ''));
  el('riprova').addEventListener('click', function () { location.reload(); });

  var tok = '';
  try { tok = localStorage.getItem(VOCE_TOKEN) || ''; } catch (e) {}
  /* il sistema sa gia' che la rete non c'e': inutile aspettare il Worker per 12 secondi */
  function senzaRete() { return typeof navigator !== 'undefined' && navigator.onLine === false; }
  var NON_SO = 'Non riesco a verificare il tuo accesso adesso. Riprova tra poco.';

  /* LA CHIAVE SUL DISPOSITIVO (G2, 07/10). Senza rete, o quando il Worker non sa
     rispondere, la copia salvata si apre con la chiave che sta su questo dispositivo, se
     c'e' e vale (ChiaveDispositivo.leggi). `poi(esito)` = cosa dire se non si apre.
     La chiave passa ai motori della pagina (studio_fetch.js la cerca dopo quella della
     sessione) PRIMA che la pagina parta: si lascia nella finestra, che sopravvive alla
     sostituzione del documento. Si toglie dal dispositivo solo se NON APRE la sua
     pubblicazione: un guasto della pagina dopo non dice niente della chiave. */
  function dalDispositivo(poi) {
    ChiaveDispositivo.leggi(SALT, tok, true).then(function (es) {
      if (!es.chiave) { poi(es); return; }
      dici('Apro lo Studypack completo salvato su questo dispositivo…');
      decifraCon(es.chiave).then(function (html) {
        try { window[ChiaveDispositivo.GLOBALE] = {salt: SALT, chiave: es.chiave}; } catch (e) {}
        apri(html);
      }, function () {
        ChiaveDispositivo.togli([SALT]).then(function () { poi({motivo: 'guasto'}); });
      });
    });
  }
  /* SENZA RETE (07/10, verifica OFF-2 e OFF-6; G2): la strada per uscire, visibile (gli
     appunti gratuiti, la home), e la frase giusta per cio' che c'e' sul dispositivo. Una
     chiave in sessione di un'altra pubblicazione, o solo chiavi di altre pubblicazioni sul
     dispositivo, vogliono dire che questa copia salvata e' di una versione precedente: con la
     rete l'hai gia' aperto, e consigliarglielo sarebbe falso. */
  function senzaReteDi(es) {
    var m = (es && es.motivo) || '';
    var altra = m === 'altra' || !!(cache && cache.salt && cache.salt !== SALT);
    mostra('fuori');
    riprova(altra
      ? 'Sei senza rete, e questa copia dello Studypack completo è di una versione ' +
        'precedente: la chiave che hai adesso non la apre. Con la rete apri la pagina ' +
        'dell’app e premi «Aggiorna».'
      : m === 'scaduta'
      ? 'Sei senza rete, e la chiave dello Studypack completo su questo dispositivo è ' +
        'scaduta: vale ' + ChiaveDispositivo.GIORNI + ' giorni dall’ultima volta che l’hai ' +
        'salvato o aperto con la rete. Aprilo una volta con la rete e torna a valere.'
      : m === 'orologio'
      ? 'Sei senza rete, e l’orologio del dispositivo è tornato indietro: per prudenza la ' +
        'chiave dello Studypack completo si è cancellata. Aprilo una volta con la rete e ' +
        'torna a valere.'
      : 'Sei senza rete. Lo Studypack completo salvato si apre senza rete per 30 giorni dall’ultima volta che l’hai salvato o aperto con la rete: la chiave che lo apre resta su questo dispositivo, legata al tuo account, e si cancella quando esci dall’account. Riprova appena c’è campo.');
  }

  function chiediAllAccount() {
    /* il nome deciso anche qui (revisione della fetta F4: restava il nome vecchio) */
    if (!API) { riprova('Lo Studypack completo non si può aprire adesso: riprova fra poco.'); return; }
    /* STATO 1, NON ENTRATO (fetta F4): «Entra» e la vetrina */
    if (!tok) {
      fuori('Questa pagina fa parte dello Studypack completo: entra col tuo account ' +
            'e si apre da sola.');
      return;
    }
    var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    fetch(API + '/studio/chiave?sale=' + encodeURIComponent(SALT),
          {headers: {'Authorization': 'Bearer ' + tok},
           signal: ctrl ? ctrl.signal : undefined})
      .then(function (r) {
        clearTimeout(timer);
        if (r.status === 401) return {sloggato: true};
        return r.json().then(function (d) { d._stato = r.status; return d; });
      })
      .then(function (d) {
        if (d.sloggato) {
          /* il token e' MORTO: si toglie, o entra.html lo crederebbe vivo; e con lui la
             chiave sul dispositivo, che e' legata a quella sessione (G2) */
          try { localStorage.removeItem(VOCE_TOKEN); } catch (e) {}
          ChiaveDispositivo.dimentica();
          fuori('La sessione è scaduta: entra di nuovo e la pagina si apre da sola.');
          return;
        }
        /* Un «si'» SENZA chiave e' un «non lo so», mai un «no»: e' cio' che
           risponde un Worker di prima del 2026-09-19 (password al posto della
           chiave), e mandare al pagamento proprio gli abbonati sarebbe il guasto
           peggiore (finding X3/Z1 della review). La copia salvata, se c'e' la sua
           chiave sul dispositivo, si apre lo stesso (G2). */
        if (d._stato === 200 && d.consentito && !d.chiave) {
          dalDispositivo(function () { riprova(NON_SO); });
          return;
        }
        /* STATO 3, CON DIRITTO: si apre da sola */
        if (d._stato === 200 && d.consentito && d.chiave) {
          dici('Studypack completo attivo: apro la pagina…');
          /* LA CHIAVE SUL DISPOSITIVO SI RINNOVA (G2): dopo il «si'», con la chiave che ha
             APERTO la pagina, se la copia di questa pubblicazione e' salvata (dopoSi). Il
             Worker dice anche l'account e l'impronta della madre: le voci che il «si'»
             smentisce (un altro account, una madre ruotata) se ne vanno. */
          var madri = [];
          if (d.madre) madri.push(d.madre);
          if (d.madre_precedente) madri.push(d.madre_precedente);
          var info = {uid: d.uid || null, madre: d.madre || '', madri: madri};
          /* chiave_precedente: c'e' solo nei minuti di una rotazione della
             chiave madre, quando online puo' esserci ancora la build di prima */
          return apriCon(d.chiave).then(function () {
            ChiaveDispositivo.dopoSi(SALT, b2a(d.chiave), tok, info);
          }, function (e) {
            if (!d.chiave_precedente) throw e;
            return apriCon(d.chiave_precedente).then(function () {
              info.madre = d.madre_precedente || '';
              ChiaveDispositivo.dopoSi(SALT, b2a(d.chiave_precedente), tok, info);
            });
          }).then(null, function () {
            /* nessuna chiave del Worker apre questa pagina: e' di una pubblicazione
               sostituita, o di una madre che non c'e' piu'. La chiave del dispositivo per
               questa pubblicazione non ha piu' chi la garantisce. */
            ChiaveDispositivo.togli([SALT]);
            riprova('Questa pagina appartiene a una pubblicazione appena sostituita: ricaricala.');
          });
        }
        /* Si decide SOLO davanti a un «no» ESPLICITO (200). Qualunque altra
           risposta — un Worker vecchio che non conosce la rotta, un 503, un
           500 — e' un «non lo so», e un «non lo so» non deve mai mandare a
           pagare chi ha gia' pagato. Con la chiave sul dispositivo la copia salvata
           si apre (G2): e' lo stesso caso di «senza rete». */
        if (d._stato !== 200) {
          dalDispositivo(function () { riprova(NON_SO); });
          return;
        }
        /* STATO 2, ENTRATO SENZA DIRITTO, nei suoi casi: il pagamento che aspetta la
           conferma dell'email, l'email da confermare, il diritto parziale, nessun
           diritto. Mai un rinvio automatico, sempre la strada giusta (fetta F4). E in
           tutti: il diritto non c'e', quindi la chiave sul dispositivo se ne va (G2). */
        ChiaveDispositivo.dimentica();
        if (d.in_attesa) {
          fuori('Conferma l’email: il pagamento ti aspetta. Abbiamo ricevuto il tuo ' +
                'pagamento e si attiva appena confermi il tuo indirizzo email: ' +
                'controlla la posta, anche lo spam, o rimanda il link dal tuo profilo.',
                false, true);
          return;
        }
        /* email non confermata: se un accesso e' gia' legato a quell'indirizzo, e'
           la conferma che manca — lo si dice e non lo si manda a pagare da solo.
           La frase NON parla di «pagato o donato» ne' di un accesso che «si attiva
           da solo» (audit 2026-09-24, finding PAG-4): oggi il webhook di Ko-fi e'
           spento (i premi dei sostenitori li attiva lo staff) e Stripe non e'
           acceso (`site_build.PAGAMENTI_PROVIDER` vuoto), quindi chi aveva appena
           pagato o donato leggeva una promessa che nessuno manteneva. Detta cosi'
           e' vera con qualunque provider acceso o spento. */
        if (d.email_da_confermare) {
          fuori('Il tuo account non ha ancora lo Studypack completo. Se ti abbiamo già dato ' +
                "l’accesso con questa email, si attiva appena la confermi: dal " +
                'tuo profilo rimandi il link.', false, true);
          mostra('abbonati');
          return;
        }
        /* «Scrivici» senza un posto dove scrivere e' una porta dipinta sul muro
           (audit 2026-09-24, finding PAG-5): il ramo chiamava fuori(..., false)
           e basta, e il bottone d'aiuto restava nascosto. Lo si mostra come nel
           ramo senza diritti. */
        if (d.parziale) {
          fuori('Il tuo accesso non comprende tutto lo Studypack completo, e questa ' +
                'pagina ne fa parte. Scrivici se pensi sia un errore.', false);
          mostra('aiuto');
          return;
        }
        /* nessun diritto: la vetrina, e per chi ha GIA' pagato il profilo (dice a che
           punto e' il pagamento) e l'aiuto (fetta F4, «Hai già pagato?») */
        fuori('Il tuo account non ha ancora lo Studypack completo. Se hai già pagato, ' +
              'nel tuo profilo vedi a che punto è.', false);
        mostra('profilo');
        mostra('aiuto');
      })
      .catch(function (e) {
        clearTimeout(timer);
        /* SENZA RETE (07/10, l'app salva lo Studypack com'è online): la pagina salvata è
           arrivata. Dal 07/10 (G2) la sua chiave puo' stare sul dispositivo: la si prova, e
           solo se non c'e' (o non vale) si dice cosa manca, invece di un «riprova» che
           senza campo non porta da nessuna parte. Un'attesa scaduta o un errore che non e'
           di rete restano un «non lo so». */
        var giu = senzaRete() || !!(e && e.name === 'TypeError');
        dalDispositivo(function (es) {
          if (giu) senzaReteDi(es); else riprova(NON_SO);
        });
      });
  }

  /* La chiave di QUESTA build gia' in sessione: si apre senza chiedere niente.
     Se non apre (build sostituita, voce guasta) la si butta e si va avanti — mai
     una pagina muta. */
  var cache = null, entrato = !!tok;
  try { cache = JSON.parse(sessionStorage.getItem(VOCE_CHIAVE) || 'null'); } catch (e) {}
  /* la chiave in sessione vale solo finche' c'e' un account entrato: chi esce
     da un'altra scheda non deve lasciare /studio aperta in questa (finding Z9).
     Lo stesso per la chiave sul dispositivo (G2): senza nessuno entrato se ne va. */
  if (cache && !entrato) dimentica();
  if (!entrato) ChiaveDispositivo.dimentica();
  /* Senza la chiave in sessione: se il sistema sa gia' che la rete non c'e', la chiave
     del dispositivo subito (G2); altrimenti si chiede all'account. */
  function avanti() {
    if (entrato && senzaRete()) { dalDispositivo(senzaReteDi); return; }
    chiediAllAccount();
  }
  if (cache && entrato && cache.salt === SALT && cache.k) {
    var k = null;
    try { k = b2a(cache.k); } catch (e) {}
    if (k) {
      decifra(k).catch(function () { dimentica(); avanti(); });
    } else {
      dimentica(); avanti();
    }
  } else {
    avanti();
  }
})();
</script>
</body>
