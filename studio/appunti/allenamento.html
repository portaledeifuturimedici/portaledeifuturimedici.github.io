.card{width:min(92vw,380px);padding:34px 30px;border-radius:18px;background:#221B45;
  border:1px solid #362C60;box-shadow:0 18px 50px rgba(0,0,0,.45)}

  border:1px solid #362C60;background:#14102A;color:#EDE9FF;font-size:15px}

  background:#7C93FF;color:#14102A;font-size:14.5px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.err{display:none;margin-top:11px;font-size:13px;color:#FF6B5C}
.err.show{display:block}
</style>

  function b2a(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function apri(html) {
    /* NON document.write: misurato sul live 2026-07-21, il documento NON veniva
       sostituito — la pagina decifrata finiva APPESA dentro il cancello (la
       .card della password restava nel DOM, le <meta> del contenuto cadevano
       nel body, il titolo restava «— accesso») e soprattutto sopravviveva lo
       <style> del cancello con `body{display:flex;align-items:center}`: il
       <main> si stringeva a 357px su 1265 e la griglia .doc calcolava
       `250px 0px` -> contenuto illeggibile, su desktop E su mobile.
       Qui si sostituisce l'INTERO <html>, così testa e stili del cancello se
       ne vanno con lui. */
    var nuovo = new DOMParser().parseFromString(html, 'text/html');
    document.replaceChild(document.importNode(nuovo.documentElement, true),
                          document.documentElement);
    /* gli script adottati da un altro documento NON si eseguono: vanno
       ricreati, o il sito resta senza tema/indice/ricerca (site.js). */
    var vecchi = document.querySelectorAll('script');
    for (var i = 0; i < vecchi.length; i++) {
      var s = vecchi[i], n = document.createElement('script');
      for (var j = 0; j < s.attributes.length; j++) {
        n.setAttribute(s.attributes[j].name, s.attributes[j].value);
      }
      /* Uno script con src INSERITO da codice e' `async` per difetto: eseguono
         in ordine di ARRIVO, non di documento — e `defer` scritto nel tag non
         conta piu'. Finche' i motori di studio erano indipendenti nessuno se
         ne accorgeva; da quando hanno bisogno che studio_fetch.js sia gia'
         partito, l'ordine e' sostanza. `async=false` e' il modo standard per
         riavere l'ordine del documento.
         NB: qui dentro NON si scrivono le parole-spia di verifica() (sono le
         parole che esistono solo nel chiaro): finirebbero nella pagina-cancello
         e la farebbero passare per non cifrata. */
      n.async = false;
      n.text = s.text;
      s.parentNode.replaceChild(n, s);
    }
  }
  function decifra(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (k) {
        return crypto.subtle.decrypt({name: 'AES-GCM', iv: b2a(IV)}, k, b2a(DATA));
      })
      .then(function (buf) { apri(new TextDecoder().decode(buf)); });
  }
  /* chiave gia' derivata in questa sessione? niente prompt */
  try {
    var cache = JSON.parse(sessionStorage.getItem('studio-key') || 'null');
    if (cache && cache.salt === SALT) {
      decifra(b2a(cache.k)).catch(function () {});
    }
  } catch (e) {}
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.className = 'err';
    var pw = document.getElementById('pw').value;
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2',
                            false, ['deriveBits'])
      .then(function (k) {
        return crypto.subtle.deriveBits(
          {name: 'PBKDF2', hash: 'SHA-256', salt: b2a(SALT), iterations: ITER},
          k, 256);
      })
      .then(function (bits) {
        var raw = new Uint8Array(bits);
        /* La chiave si registra PRIMA di aprire la pagina, non dopo: da quando
           i DATI dei motori sono cifrati, gli script della pagina decifrata la
           cercano in sessione appena partono, e «dopo» era una gara che si
           vinceva solo per come sono ordinati microtask e task. Se poi la
           password si rivela sbagliata la si toglie subito (vedi il .catch):
           una chiave sbagliata in sessione farebbe fallire il caricamento dei
           materiali anche sulle pagine successive. */
        var b = '';
        for (var i = 0; i < raw.length; i++) b += String.fromCharCode(raw[i]);
        try { sessionStorage.setItem('studio-key',
              JSON.stringify({salt: SALT, k: btoa(b)})); } catch (e) {}
        return decifra(raw);
      })
      .catch(function () {
        try { sessionStorage.removeItem('studio-key'); } catch (e) {}
        err.className = 'err show'; btn.disabled = false;
      });
  });
