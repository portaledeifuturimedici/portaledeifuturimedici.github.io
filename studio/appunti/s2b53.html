  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.className = 'err';
    var pw = document.getElementById('pw').value;
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2',
                            false, ['deriveBits'])
      .then(function (k) {
        return crypto.subtle.deriveBits(
          {name: 'PBKDF2', hash: 'SHA-256', salt: b2a(SALT), iterations: ITER},
          k, 256);
      })
      .then(function (bits) {
        var raw = new Uint8Array(bits);
        /* La chiave si registra PRIMA di aprire la pagina, non dopo: da quando
           i DATI dei motori sono cifrati, gli script della pagina decifrata la
           cercano in sessione appena partono, e «dopo» era una gara che si
           vinceva solo per come sono ordinati microtask e task. Se poi la
           password si rivela sbagliata la si toglie subito (vedi il .catch):
           una chiave sbagliata in sessione farebbe fallire il caricamento dei
           materiali anche sulle pagine successive. */
        var b = '';
        for (var i = 0; i < raw.length; i++) b += String.fromCharCode(raw[i]);
        try { sessionStorage.setItem('studio-key',
              JSON.stringify({salt: SALT, k: btoa(b)})); } catch (e) {}
        return decifra(raw);
      })
      .catch(function () {
        try { sessionStorage.removeItem('studio-key'); } catch (e) {}
        err.className = 'err show'; btn.disabled = false;
      });
  });
})();
</script>
