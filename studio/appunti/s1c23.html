           da solo» (audit 2026-09-24, finding PAG-4): oggi il webhook di Ko-fi e'
           spento (i premi dei sostenitori li attiva lo staff) e Stripe non e'
           acceso (`site_build.PAGAMENTI_PROVIDER` vuoto), quindi chi aveva appena
           pagato o donato leggeva una promessa che nessuno manteneva. Detta cosi'
           e' vera con qualunque provider acceso o spento. */
        if (d.email_da_confermare) {
          fuori('Il tuo account non ha ancora lo Studypack completo. Se ti abbiamo già dato ' +
                "l’accesso con questa email, si attiva appena la confermi: dal " +
                'tuo profilo rimandi il link.', false, true);
          mostra('abbonati');
          return;
        }
        /* «Scrivici» senza un posto dove scrivere e' una porta dipinta sul muro
           (audit 2026-09-24, finding PAG-5): il ramo chiamava fuori(..., false)
           e basta, e il bottone d'aiuto restava nascosto. Lo si mostra come nel
           ramo senza diritti. */
        if (d.parziale) {
          fuori('Il tuo accesso non comprende tutto lo Studypack completo, e questa ' +
                'pagina ne fa parte. Scrivici se pensi sia un errore.', false);
          mostra('aiuto');
          return;
        }
        /* nessun diritto: la vetrina, e per chi ha GIA' pagato il profilo (dice a che
           punto e' il pagamento) e l'aiuto (fetta F4, «Hai già pagato?») */
        fuori('Il tuo account non ha ancora lo Studypack completo. Se hai già pagato, ' +
              'nel tuo profilo vedi a che punto è.', false);
        mostra('profilo');
        mostra('aiuto');
      })
      .catch(function (e) {
        clearTimeout(timer);
        /* SENZA RETE (07/10, l'app salva lo Studypack com'è online): la pagina salvata è
           arrivata. Dal 07/10 (G2) la sua chiave puo' stare sul dispositivo: la si prova, e
           solo se non c'e' (o non vale) si dice cosa manca, invece di un «riprova» che
           senza campo non porta da nessuna parte. Un'attesa scaduta o un errore che non e'
           di rete restano un «non lo so». */
        var giu = senzaRete() || !!(e && e.name === 'TypeError');
        dalDispositivo(function (es) {
          if (giu) senzaReteDi(es); else riprova(NON_SO);
        });
      });
  }

  /* La chiave di QUESTA build gia' in sessione: si apre senza chiedere niente.
     Se non apre (build sostituita, voce guasta) la si butta e si va avanti — mai
     una pagina muta. */
  var cache = null, entrato = !!tok;
  try { cache = JSON.parse(sessionStorage.getItem(VOCE_CHIAVE) || 'null'); } catch (e) {}
  /* la chiave in sessione vale solo finche' c'e' un account entrato: chi esce
     da un'altra scheda non deve lasciare /studio aperta in questa (finding Z9).
     Lo stesso per la chiave sul dispositivo (G2): senza nessuno entrato se ne va. */
  if (cache && !entrato) dimentica();
  if (!entrato) ChiaveDispositivo.dimentica();
  /* Senza la chiave in sessione: se il sistema sa gia' che la rete non c'e', la chiave
     del dispositivo subito (G2); altrimenti si chiede all'account. */
  function avanti() {
    if (entrato && senzaRete()) { dalDispositivo(senzaReteDi); return; }
    chiediAllAccount();
  }
  if (cache && entrato && cache.salt === SALT && cache.k) {
    var k = null;
    try { k = b2a(cache.k); } catch (e) {}
    if (k) {
      decifra(k).catch(function () { dimentica(); avanti(); });
    } else {
      dimentica(); avanti();
    }
  } else {
    avanti();
  }
})();
</script>
