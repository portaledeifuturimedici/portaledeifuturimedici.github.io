        if (r.status === 401) { dici('Questa pagina è riservata allo staff.', [['Entra', '/appunti/account/entra.html'], ['Torna alla home', '/']]); return null; }
        if (r.status === 403) { dici('Questa pagina è riservata allo staff, e questo account non lo è.', [['Torna alla home', '/']]); return null; }

          if (r.status === 200 && d.consentito && d.chiave) return apri(d.chiave);

        });
